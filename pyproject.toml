[project]
name = "dataset-doctor"
version = "0.1.0"
description = "AI-powered dataset quality and analysis tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
